# All settings of the project in one place.

# --- Data ---
universe: [BTC, ETH, SOL, BNB, XRP, ADA, AVAX, LINK, DOT, LTC, DOGE, TRX]   # Binance USDT perpetuals
start: "2023-01-01"
train_end: "2025-12-31"   # train = start .. train_end, test = everything after
end: "2026-10-31"

# --- Costs (per leg, per trade, as a fraction of the traded amount) ---
fee: 0.0005               # 0.05% Binance futures taker fee
slippage: 0.0002          # 0.02% assumed price impact

# --- Strategy (chosen in the notebook on TRAIN data only) ---
pair: [ETH, BNB]          # trade A against B: spread = log(A) - beta * log(B)
hedge_window: 720         # hours of data for the rolling hedge ratio beta (720 h = 30 days)
zscore_lookback: 336      # hours for the rolling mean / std of the spread (336 h = 2 weeks)
entry_z: 2.5              # open a trade when |z| > entry_z
exit_z: 0.0               # close it when z is back at the mean
stop_z: 3.5               # stop loss: close when |z| > stop_z
time_stop_hours: 168      # time stop: close a trade after this many hours
